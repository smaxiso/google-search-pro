<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <!-- Toast Notification Container -->
    <div id="toast" class="toast">
        <span class="toast-icon material-icons">info</span>
        <span class="toast-message"></span>
    </div>

    <!-- Background decoration -->
    <div class="background-decoration">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="material-icons">search</span>
                <h1>Google Search Pro</h1>
            </div>
            <p class="subtitle">Advanced Google dorking made simple</p>
        </div>

        <form id="dorking-form" class="search-form">
            <div class="form-row">
                <div class="input-group">
                    <label for="query">Search Query</label>
                    <div class="input-container">
                        <span class="material-icons input-icon">search</span>
                        <input type="text" id="query" placeholder="Enter your search query">
                    </div>
                </div>

                <div class="input-group">
                    <label for="category">Category</label>
                    <div class="select-container">
                        <span class="material-icons select-icon">category</span>
                        <select id="category">
                            <option value="">All Categories</option>
                            <option value="book">📚 Books & Documents</option>
                            <option value="music">🎵 Music & Audio</option>
                            <option value="video">🎬 Videos & Movies</option>
                            <option value="software">💾 Software & Apps</option>
                            <option value="image">🖼️ Images & Photos</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="filetype">File Type</label>
                    <div class="select-container">
                        <span class="material-icons select-icon">description</span>
                        <select id="filetype">
                            <option value="">Any File Type</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="site">Specific Site</label>
                    <div class="input-container">
                        <span class="material-icons input-icon">language</span>
                        <input type="text" id="site" placeholder="e.g., example.com">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="sort">Sort By</label>
                    <div class="select-container">
                        <span class="material-icons select-icon">sort</span>
                        <select id="sort">
                            <option value="">Relevance</option>
                            <option value="date">Date Modified</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="size">File Size</label>
                    <div class="select-container">
                        <span class="material-icons select-icon">storage</span>
                        <select id="size">
                            <option value="">Any Size</option>
                            <option value="small">Small (< 10MB)</option>
                            <option value="medium">Medium (10MB - 100MB)</option>
                            <option value="large">Large (> 100MB)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="search-btn">
                    <span class="material-icons">search</span>
                    <span>Search</span>
                </button>
                <button type="button" id="clear-btn" class="clear-btn">
                    <span class="material-icons">clear</span>
                    <span>Clear</span>
                </button>
            </div>

            <div class="query-preview">
                <div class="preview-header">
                    <span class="material-icons">code</span>
                    <span>Generated Query Preview</span>
                </div>
                <div id="query-display" class="query-text">Enter search parameters to see the generated query</div>
                <button type="button" id="copy-query" class="copy-btn">
                    <span class="material-icons">content_copy</span>
                    <span>Copy Query</span>
                </button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
